<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The River Run – Fresh Fish Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f4c5c;
  --primary-dark:#0b3b45;
  --secondary:#f4f9fb;
  --accent:#20c9c9;
  --accent-soft:#e0fbfc;
  --danger:#e63946;
  --card:#082c34;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:var(--primary);
  color:white;
}

/* ===== TYPOGRAPHY ===== */
h1,h2,h3{
  font-family:"Poppins",sans-serif;
}

h1{font-size:42px}
h2{font-size:28px}
h3{font-size:18px}

/* ===== BANNER ===== */
.top-banner{
  background:linear-gradient(90deg,#20c9c9,#18aeb0);
  color:#003033;
  text-align:center;
  padding:10px;
  font-weight:600;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
  position:sticky;
  top:0;
  background:rgba(15,76,92,0.85);
  backdrop-filter:blur(10px);
}

nav a{
  margin:0 12px;
  text-decoration:none;
  color:white;
}

nav a:hover{
  color:var(--accent);
}

/* SEARCH */
.search-container input{
  padding:10px;
  border-radius:20px;
  border:1px solid rgba(32,201,201,0.3);
  background:#08313a;
  color:white;
}

/* BUTTON */
button{
  background:var(--accent);
  color:#003033;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#18aeb0;
}

/* HERO */
.hero{
  padding:80px 20px;
  text-align:center;
  background:linear-gradient(180deg,#0f4c5c,#072d36);
}

.slider img{
  width:100%;
  height:400px;
  object-fit:cover;
  display:none;
}
.slider img.active{
  display:block;
}

/* CARDS */
.card{
  background:var(--primary-dark);
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(32,201,201,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

/* PRODUCTS */
.product{
  background:var(--primary-dark);
  border-radius:12px;
  border:1px solid rgba(32,201,201,0.2);
}

/* PRICE */
.price-box{
  color:var(--accent);
  font-size:24px;
}

/* INPUT */
input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:6px;
  border:1px solid rgba(32,201,201,0.3);
  background:#08313a;
  color:white;
}

/* SECTION */
.section{
  padding:60px 20px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:40px;
  opacity:.7;
}

/* MOBILE */
@media(max-width:768px){
  header{flex-direction:column}
  h1{font-size:32px}
}
</style>
</head>

<body>

<div class="top-banner">
🌊 100% Pre-Order: আমরা অর্ডারের পর মাছ সংগ্রহ করি
</div>

<header>
  <h2>The River Run</h2>

  <div class="search-container">
    <input placeholder="Search fish...">
  </div>

  <nav>
    <a href="#">Home</a>
    <a href="#">Fish</a>
    <a href="#">Cart</a>
    <a href="#">Track</a>
  </nav>

  <button>Order Now</button>
</header>

<section class="hero">
  <h1>Fresh Fish Delivered</h1>
  <p>From river to your doorstep</p>

  <div class="slider">
    <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f" class="active">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836">
  </div>

  <br>
  <button>Browse Fish</button>
</section>

<section class="section">
  <h2 style="text-align:center;">Categories</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;">
    <div class="card">River Fish</div>
    <div class="card">Sea Fish</div>
    <div class="card">Shrimp</div>
    <div class="card">Hilsa</div>
  </div>
</section>

<section class="section">
  <h2 style="text-align:center;">Popular Fish</h2>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;">
    
    <div class="product">
      <img src="https://images.unsplash.com/photo-1604908176997-4311f8e45bfa">
      <div style="padding:15px;">
        <h3>Rui Fish</h3>
        <div class="price-box">৳320/kg</div>
        <button>Add to Cart</button>
      </div>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092">
      <div style="padding:15px;">
        <h3>Hilsa</h3>
        <div class="price-box">৳1200/kg</div>
        <button>Add to Cart</button>
      </div>
    </div>

  </div>
</section>

<div class="footer">
© 2026 The River Run
</div>

<script>
const images=document.querySelectorAll(".slider img");
let i=0;
setInterval(()=>{
  images[i].classList.remove("active");
  i=(i+1)%images.length;
  images[i].classList.add("active");
},3000);
</script>

</body>
</html>
