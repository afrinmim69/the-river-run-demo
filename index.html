<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The River Run – Fresh Fish Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f4c5c;
  --dark:#0b3b45;
  --card:#082c34;
  --accent:#20c9c9;
  --accent-soft:#e0fbfc;
  --danger:#e63946;
}

/* RESET */
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Inter",sans-serif;
  background:var(--primary);
  color:white;
}

/* TYPOGRAPHY */
h1,h2,h3{
  font-family:"Poppins",sans-serif;
}

h1{font-size:42px}
h2{font-size:30px}
h3{font-size:18px}

p{
  opacity:.85;
  font-size:14px;
}

/* BANNER */
.top-banner{
  background:linear-gradient(90deg,#20c9c9,#18aeb0);
  color:#003033;
  padding:10px;
  font-weight:600;
  text-align:center;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
  position:sticky;
  top:0;
  background:rgba(15,76,92,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(32,201,201,0.3);
}

nav a{
  margin:0 12px;
  color:white;
  text-decoration:none;
  font-weight:500;
}

nav a:hover{
  color:var(--accent);
}

/* SEARCH */
.search-container input{
  border-radius:20px;
  border:1px solid rgba(32,201,201,0.3);
  background:#08313a;
  padding:10px 15px;
  color:white;
}

/* BUTTON */
button{
  background:var(--accent);
  color:#003033;
  padding:12px 20px;
  border-radius:8px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#18aeb0;
}

/* HERO */
.hero{
  padding:80px 20px;
  text-align:center;
  background:linear-gradient(180deg,#0f4c5c,#072d36);
}

.hero h1{
  font-size:44px;
}

.hero p{
  font-size:16px;
}

/* SLIDER */
.slider{
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(32,201,201,0.3);
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.slider img{
  width:100%;
  height:420px;
  object-fit:cover;
  display:none;
}

.slider img.active{
  display:block;
}

/* CARD */
.card{
  background:var(--dark);
  padding:24px;
  border-radius:12px;
  border:1px solid rgba(32,201,201,0.2);
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* PRODUCT */
.product{
  background:var(--dark);
  border-radius:12px;
  border:1px solid rgba(32,201,201,0.2);
  overflow:hidden;
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.product-body{
  padding:15px;
  text-align:center;
}

/* PRICE */
.price-box{
  font-size:26px;
  color:var(--accent);
  font-weight:bold;
}

/* INPUT */
input,select,textarea{
  border:1px solid rgba(32,201,201,0.3);
  background:#08313a;
  color:white;
  border-radius:6px;
  padding:12px;
}

/* SUMMARY */
.summary{
  background:rgba(8,44,52,0.9);
  border:1px solid rgba(32,201,201,0.3);
}

/* SECTION */
.section{
  padding:70px 20px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:40px;
  opacity:.7;
}

/* MOBILE */
@media(max-width:768px){
  header{flex-direction:column}
  h1{font-size:32px}
}
</style>
</head>

<body>
  <div class="top-banner">
  🌊 100% Pre-Order Basis: Fresh fish sourced after your order
</div>

<header>
  <h2 onclick="show('home')">The River Run</h2>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search fish..." onkeyup="searchFish()">
    <div id="searchSuggestions" class="suggestions-box hidden"></div>
  </div>

  <nav>
    <a href="#" onclick="show('home')">Home</a>
    <a href="#" onclick="show('categories')">Fish</a>
    <a href="#" onclick="showCart()">Cart (<span id="cartCount">0</span>)</a>
    <a href="#" onclick="show('track')">Track</a>
  </nav>

  <button onclick="show('categories')">Order Now</button>
</header>

<section id="home">
  <div class="hero">
    <h1>Fresh Fish Delivered</h1>
    <p>From river to your doorstep</p>

    <div class="slider">
      <img src="images/slider1.png" class="active">
      <img src="images/slider2.png">
    </div>
  </div>
</section>

<section id="categories" class="section hidden">
  <h2>Categories</h2>
  <div class="categories">
    <div class="card" onclick="loadCategory('river')">River Fish</div>
    <div class="card" onclick="loadCategory('sea')">Sea Fish</div>
    <div class="card" onclick="loadCategory('shrimp')">Shrimp</div>
  </div>
</section>

<section id="products" class="section hidden">
  <h2 id="productTitle"></h2>
  <div id="productList"></div>
</section>

<section id="cart" class="section hidden">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal"></h3>
</section>

<div class="footer">
  © 2026 The River Run
</div>

<script>

/* ===== DATA ===== */
const fish={
  river:["rui","katla","boal"],
  sea:["rupchanda"],
  shrimp:["golda"]
};

let cart = JSON.parse(localStorage.getItem('riverRunCart')) || [];

/* ===== UI NAVIGATION ===== */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

/* ===== SLIDER ===== */
const images=document.querySelectorAll(".slider img");
let i=0;
setInterval(()=>{
  images[i].classList.remove("active");
  i=(i+1)%images.length;
  images[i].classList.add("active");
},4000);

/* ===== CATEGORY LOAD ===== */
function loadCategory(cat){
  show("products");
  let list=document.getElementById("productList");
  list.innerHTML="";

  fish[cat].forEach(name=>{
    let div=document.createElement("div");
    div.className="product";
    div.innerHTML=`
      <div class="product-body">
        <h3>${name}</h3>
        <button onclick="addToCart('${name}')">Add</button>
      </div>
    `;
    list.appendChild(div);
  });
}

/* ===== CART ===== */
function addToCart(name){
  cart.push({name,price:100});
  localStorage.setItem('riverRunCart',JSON.stringify(cart));

  document.getElementById("cartCount").innerText=cart.length;

  alert("Added to cart ✅");
}

function showCart(){
  show("cart");
  let items=document.getElementById("cartItems");
  items.innerHTML="";
  let total=0;

  if(cart.length===0){
    items.innerHTML="<p>Cart is empty</p>";
    return;
  }

  cart.forEach(i=>{
    items.innerHTML+=`<p>${i.name} - ৳${i.price}</p>`;
    total+=i.price;
  });

  document.getElementById("cartTotal").innerText="Total: ৳"+total;
}

/* ===== SEARCH ===== */
let allFish=[];
for(let c in fish){
  fish[c].forEach(f=>allFish.push(f));
}

function searchFish(){
  let input=document.getElementById("searchInput").value.toLowerCase();
  let box=document.getElementById("searchSuggestions");

  box.innerHTML="";

  if(input===""){
    box.classList.add("hidden");
    return;
  }

  let matches=allFish.filter(f=>f.includes(input));

  matches.forEach(m=>{
    let div=document.createElement("div");
    div.innerText=m;
    div.onclick=()=>addToCart(m);
    box.appendChild(div);
  });

  box.classList.remove("hidden");
}

</script>

</body>
</html>
